pre-commit:
  parallel: true
  commands:
    python:
      glob: "{tools/*.py,ruff.toml}"
      run: just check-python
    web:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,css,html,json}"
      run: just check-web
    just-format:
      glob: "Justfile"
      run: just --fmt --check
    actions:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint && pinact run --check --fix=false --no-api
    secrets:
      run: gitleaks git --staged --redact --no-banner

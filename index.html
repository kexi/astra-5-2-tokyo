<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>東京駅上空 — PLATEAU / Three.js</title>
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
    {"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/addons/"}}
  </script>
</head>
<body>
  <main>
    <section class="stage" aria-label="東京駅周辺の3D都市モデル">
      <canvas id="view" aria-label="東京駅周辺の3D表示"></canvas>
      <header class="mast">
        <p class="coordinates">35°40′52″ N　139°45′58″ E</p>
        <h1>東京駅上空</h1>
        <p class="subheading" lang="en">Tokyo Station from above</p>
      </header>
      <div id="loading" role="status"><span>都市モデルを読み込み中</span><progress aria-label="都市モデルの読み込み"></progress></div>
      <aside class="telemetry" aria-label="飛行位置">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" opacity=".5"/><path id="needle" d="M13 4l4 13-4-2-4 2z" fill="currentColor"/></svg>
        <div><span id="bearing">—</span><span id="height">— m</span></div>
      </aside>
      <div id="film-title" aria-hidden="true"><p>MARUNOUCHI · TOKYO</p><strong>東京駅上空</strong></div>
      <div id="film-credit" aria-hidden="true">国土交通省 PLATEAU 2025・地理院タイルを加工して作成</div>
      <div class="film-shade" aria-hidden="true"></div>
      <footer class="flight-panel">
        <div class="transport">
          <button id="play" type="button" disabled>空撮を再生</button>
          <div class="timeline">
            <div class="track-info"><span id="shot">丸の内へ</span><output id="time" for="seek">0:00 / 0:31</output></div>
            <input id="seek" type="range" min="0" max="31.5" value="0" step=".01" aria-label="空撮の再生位置" disabled>
          </div>
          <button id="orbit" type="button" aria-pressed="false" disabled>360° 見回す</button>
          <button id="flare" type="button" aria-pressed="true" disabled>フレア</button>
        </div>
        <div class="footnote">
          <p><a class="film-link" href="output/tokyo-station.mp4">空撮動画を見る（MP4）</a><span id="hint">東京駅・丸の内・八重洲</span></p>
          <p><a href="https://www.mlit.go.jp/plateau/">国土交通省 PLATEAU 2025</a><span> / </span><a href="https://maps.gsi.go.jp/help/use.html">地理院タイル</a>を加工して作成</p>
        </div>
      </footer>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
